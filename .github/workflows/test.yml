name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_sandbox:
        description: Run pinned GJC/bubblewrap integration (fails if namespaces are unavailable)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12.12'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: Create disposable Python environment
        run: python -m venv "$RUNNER_TEMP/omg-ci-venv"

      - name: Verify offline inventory with hash-locked dependencies
        env:
          GJC_NOTIFICATIONS: '0'
          GJC_SDK_DISABLE: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          "$RUNNER_TEMP/omg-ci-venv/bin/python" ops/verify/run_ci.py \
            --install-deps --out ops/verify/artifacts/offline

      - name: Upload logs, versions, hashes, RCs, and coverage gaps
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: offline-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: ops/verify/artifacts/offline/
          if-no-files-found: error
          retention-days: 14

  sandbox:
    if: github.event_name == 'workflow_dispatch' && inputs.run_sandbox
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12.12'

      - name: Verify pinned GJC integration and namespace coverage
        env:
          GJC_NOTIFICATIONS: '0'
          GJC_SDK_DISABLE: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python ops/verify/run_sandbox_ci.py --out ops/verify/artifacts/sandbox

      - name: Upload sandbox probe and integration evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: sandbox-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: ops/verify/artifacts/sandbox/
          if-no-files-found: error
          retention-days: 14
